# Tells aidanlenahan/portfolio to regenerate its project cards
# whenever projects.json or a screenshot changes on main.
name: Notify portfolio

on:
  push:
    branches: [main]
    paths: [projects.json, 'img/**']
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send projects-updated to portfolio
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PORTFOLIO_DISPATCH_TOKEN secret is not set. Add a fine-grained PAT (portfolio repo, Contents: read & write) under Settings > Secrets and variables > Actions."
            exit 1
          fi
          gh api repos/aidanlenahan/portfolio/dispatches \
            -f event_type=projects-updated \
            -F "client_payload[sha]=${GITHUB_SHA}"
